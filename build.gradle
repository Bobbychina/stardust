plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 国内镜像优先
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        name = 'Meteor Dev Releases'
        url = 'https://maven.meteordev.org/releases'
    }
    maven {
        name = 'Meteor Dev Snapshots'
        url = 'https://maven.meteordev.org/snapshots'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    // 26.1 起 Minecraft 未混淆：没有 mappings 行，mod 依赖也不再 remap
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation("meteordevelopment:meteor-client:${project.meteor_version}") {
        changing = false
    }

    // XaeroMinimap / XaeroWorldMap（编译期）
    compileOnly("maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}")
    compileOnly("maven.modrinth:xaeros-world-map:${project.xaeros_worldmap_version}")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

processResources {
    def propertyMap = [
        "version": project.version,
        "mc_version": project.minecraft_version,
        "commit": project.findProperty("commit") ?: ""
    ]

    inputs.properties(propertyMap)
    filesMatching("fabric.mod.json") {
        expand(propertyMap)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding("UTF-8")
}

loom {
    accessWidenerPath = file("src/main/resources/stardust.accesswidener")
}
